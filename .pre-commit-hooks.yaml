- id: sort-xml
  name: Sort XML attributes using XSLT
  entry: scripts/sort-xml.sh
  language: script
  files: \.xml$
- id: xmlstarlet-format
  name: Format XML using xmlstarlet
  entry: scripts/xmlstarlet-format.sh
  language: script
  files: \.xml$
- id: make_odoo_robot_tests_githubworkflow
  name: Creates a github workflow for unit and robotests
  entry: make-odoo-robot-tests
  language: python
  pass_filenames: false
  always_run: true
  args: []

- id: zebroo-license-header
  name: Insert Zebroo license header
  entry: zebroo-license-header
  language: python
  types_or: [python, xml, javascript, ts, scss, css]
  exclude: (^|/)__manifest__\.py$

- id: zebroo-manifest-lint
  name: Lint __manifest__.py (pylint-odoo)
  entry: zebroo-manifest-lint
  language: python
  files: (^|/)__manifest__\.py$
  additional_dependencies: [pylint-odoo]

- id: zebroo-check-patchnotes
  name: Check patchnotes for changed modules
  entry: zebroo-check-patchnotes
  language: python
  pass_filenames: true
  additional_dependencies: [pyyaml]
